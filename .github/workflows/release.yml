name: Release

# Builds three-platform release artifacts with cargo-dist on version tags.
# Requires `cargo dist host-target` style tagging: push a tag like v0.1.0.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p photoforge-gui -p photoforge-cli
      - name: Stage artifacts
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME}"
          STAGE="photoforge-${VER}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          for bin in photoforge photoforge-cli; do
            EXT=""
            if [ "${{ matrix.os }}" = "windows-latest" ]; then EXT=".exe"; fi
            cp "target/${{ matrix.target }}/release/$bin$EXT" "$STAGE/"
          done
          cp README.md LICENSE "$STAGE/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$STAGE.zip" "$STAGE"
          else
            tar czf "$STAGE.tar.gz" "$STAGE"
          fi
          echo "ASSET=${STAGE}.zip" >> $GITHUB_ENV
          echo "ASSET_TGZ=${STAGE}.tar.gz" >> $GITHUB_ENV
      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
